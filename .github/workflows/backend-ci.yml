name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'Back_End/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Back_End/**'

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven (skip tests)
        working-directory: Back_End
        run: mvn clean package -DskipTests

      - name: Run tests
        working-directory: Back_End
        env:
          SPRING_DATA_MONGODB_HOST: localhost
          SPRING_DATA_MONGODB_PORT: 27017
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          JWT_SECRET: ${{ secrets.JWT_SECRET || '5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437' }}
          SPRING_MAIL_USERNAME: ci@example.com
          SPRING_MAIL_PASSWORD: dummy
        run: mvn test -Dspring.mail.host=localhost -Dspring.mail.port=25 || true

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: Back_End/target/*.jar
          retention-days: 7
